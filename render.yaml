services:
  - type: web
    name: a-margem-api
    runtime: node
    rootDir: server
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
